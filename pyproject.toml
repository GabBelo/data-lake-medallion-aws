[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "data-lake-medallion-aws"
version = "0.1.0"
description = "Pipeline Medallion (Bronze/Silver/Gold) de entregas logísticas com PySpark e AWS Glue"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pyspark==3.5.3", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
